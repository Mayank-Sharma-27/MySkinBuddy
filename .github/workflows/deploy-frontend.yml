name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "client/**"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: myskinbuddy-frontend
  ECS_CLUSTER: myskinbuddy-cluster
  ECS_SERVICE: myskinbuddy-frontend
  CONTAINER_NAME: frontend
  DOMAIN: myglowpal.com
  SUBDOMAIN: www
  NEXT_PUBLIC_API_URL: "https://myglowpal.com/api"
  NEXT_PUBLIC_SITE_URL: "https://myglowpal.com"
  TASK_DEFINITION_FILE: task-definition-frontend.json

jobs:
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::117669335220:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Create .env.production file
        run: |
          cd client
          # Get secrets from AWS Systems Manager Parameter Store
          GOOGLE_CLIENT_ID=$(aws ssm get-parameter --name "/myskinbuddy/NEXT_PUBLIC_GOOGLE_CLIENT_ID" --with-decryption --query "Parameter.Value" --output text)
          GOOGLE_CLIENT_SECRET=$(aws ssm get-parameter --name "/myskinbuddy/GOOGLE_CLIENT_SECRET" --with-decryption --query "Parameter.Value" --output text)
          AWS_ACCESS_KEY=$(aws ssm get-parameter --name "/myskinbuddy/AWS_ACCESS_KEY_ID" --with-decryption --query "Parameter.Value" --output text)
          AWS_SECRET_KEY=$(aws ssm get-parameter --name "/myskinbuddy/AWS_SECRET_ACCESS_KEY" --with-decryption --query "Parameter.Value" --output text)

          echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" > .env.production
          echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> .env.production
          echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" >> .env.production
          echo "NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL" >> .env.production
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY" >> .env.production
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_KEY" >> .env.production
          echo "AWS_REGION=$AWS_REGION" >> .env.production

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        working-directory: ./client
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          pwd
          echo "Current directory contents:"
          ls -la
          echo "\nVerifying package.json exists:"
          if [ ! -f "package.json" ]; then
            echo "Error: package.json not found!"
            exit 1
          fi
          echo "\nContents of package.json:"
          cat package.json
          echo "\nStarting Docker build with verbose output..."
          DOCKER_BUILDKIT=1 docker build --no-cache --progress=plain -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update task definition
        working-directory: ./client
        run: |
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --family $ECR_REPOSITORY --cli-input-json file://$TASK_DEFINITION_FILE --query "taskDefinition.taskDefinitionArn" --output text)
          echo "NEW_TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> $GITHUB_ENV
          echo "New task definition ARN: $NEW_TASK_DEF_ARN"

      - name: Force new deployment
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER \
                                --service $ECS_SERVICE \
                                --force-new-deployment \
                                --region $AWS_REGION

      - name: Update Route 53 records
        run: |
          ZONE_ID=$(aws route53 list-hosted-zones-by-name --dns-name $DOMAIN --query 'HostedZones[0].Id' --output text)
          ALB_DNS=$(aws elbv2 describe-load-balancers --names myskinbuddy-alb --query 'LoadBalancers[0].DNSName' --output text)

          # Create Route 53 change batch file
          cat > change-batch.json << EOF
          {
            "Changes": [
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "$DOMAIN",
                  "Type": "A",
                  "AliasTarget": {
                    "HostedZoneId": "Z35SXDOTRQ7X7K",
                    "DNSName": "$ALB_DNS",
                    "EvaluateTargetHealth": true
                  }
                }
              },
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "$SUBDOMAIN.$DOMAIN",
                  "Type": "A",
                  "AliasTarget": {
                    "HostedZoneId": "Z35SXDOTRQ7X7K",
                    "DNSName": "$ALB_DNS",
                    "EvaluateTargetHealth": true
                  }
                }
              }
            ]
          }
          EOF

          # Apply the changes
          aws route53 change-resource-record-sets --hosted-zone-id $ZONE_ID --change-batch file://change-batch.json
